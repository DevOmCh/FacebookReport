name: Direct Secure Build Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-secure-build.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild direct index.html and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='fc2f44ea7dd9ae2937e9886135d87a55f9fa5ef74b541b6efb39f42d432d076d'
          cat .parts/app00.b64 .parts/app01.b64 .parts/app02.b64 .parts/app03.b64 .parts/app04.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress > index.html
          ACTUAL="$(sha256sum index.html | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          grep -q 'Content-Security-Policy' index.html
          grep -q 'integrity=' index.html

      - name: Remove runtime bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f bootstrap.js
          rm -rf parts .parts

      - name: Commit Direct Secure Build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'security: migrate to direct secure build'
          git push origin HEAD:main
