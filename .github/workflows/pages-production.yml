# Phase 8.5 — final security audit + production freeze
name: Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify frozen direct dependencies
        shell: bash
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const fail = msg => { console.error(msg); process.exit(1); };
          if (pkg.version !== '8.5.0') fail('package version must be 8.5.0');
          if (pkg.engines?.node !== '22.x') fail('Node runtime must be frozen to 22.x');
          for (const [name, version] of Object.entries(pkg.devDependencies || {})) {
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              fail(`dependency ${name} is not pinned to an exact version: ${version}`);
            }
          }
          NODE

      - name: Install frozen build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit critical npm vulnerabilities
        run: npm audit --audit-level=critical

      - name: Audit browser source for secrets
        run: npm run audit

      - name: Build frozen production site
        run: npm run build

      - name: Final security audit
        run: npm run security:final

      - name: Verify reproducible production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/facebookreport-dist-first
          cp -a dist /tmp/facebookreport-dist-first
          npm run build
          npm run security:final
          if ! diff -qr /tmp/facebookreport-dist-first dist; then
            echo 'Production build is not reproducible from the same source/dependency set.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
