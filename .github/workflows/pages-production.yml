# Phase 8.4 — zero external static runtime + CSP lockdown
name: Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Audit browser source for secrets
        run: npm run audit

      - name: Build hardened production site
        run: npm run build

      - name: Verify Phase 8.4 production artifact
        shell: bash
        run: |
          set -euo pipefail

          if find dist -type f \( -name '*.map' -o -name '*.ts' -o -name '*.scss' \) | grep -q .; then
            echo 'Forbidden development artifacts found in dist/' >&2
            exit 1
          fi

          if grep -Rqi 'sourceMappingURL' dist; then
            echo 'sourceMappingURL found in production artifact' >&2
            exit 1
          fi

          if grep -RqiE 'fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com' dist; then
            echo 'External static-runtime host found in production artifact' >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('dist/build-manifest.json', 'utf8'));

          const fail = msg => { console.error(msg); process.exit(1); };
          if (manifest.version !== '8.4.0') fail('unexpected manifest version');
          if (!manifest.vendorSelfHosted) fail('vendorSelfHosted must be true');
          if (!manifest.fontsSelfHosted) fail('fontsSelfHosted must be true');
          if (!manifest.zeroExternalStaticRuntime) fail('zeroExternalStaticRuntime must be true');
          if (!manifest.cspLockdown) fail('cspLockdown must be true');
          if (!Array.isArray(manifest.externalStaticRuntimeHosts) || manifest.externalStaticRuntimeHosts.length !== 0) fail('externalStaticRuntimeHosts must be empty');
          if (!manifest.assets?.vendor || !/^assets\/vendor\.[a-f0-9]+\.min\.js$/.test(manifest.assets.vendor)) fail('hashed vendor asset missing');
          if (!manifest.assets?.js || !/^assets\/app\.[a-f0-9]+\.min\.js$/.test(manifest.assets.js)) fail('hashed app JS missing');
          if (!manifest.assets?.css || !/^assets\/app\.[a-f0-9]+\.min\.css$/.test(manifest.assets.css)) fail('hashed app CSS missing');
          if (!Array.isArray(manifest.assets?.fonts) || manifest.assets.fonts.length === 0) fail('local font assets missing');

          if (/<script\b[^>]*\bsrc=["']https?:\/\//i.test(html)) fail('external script tag remains');
          if (/<link\b(?=[^>]*\brel=["'][^"']*stylesheet[^"']*["'])[^>]*\bhref=["']https?:\/\//i.test(html)) fail('external stylesheet remains');
          if (/<style\b/i.test(html)) fail('inline style block remains');
          if (!/script-src(?:-elem)? 'self'/i.test(html)) fail('script CSP not self-only');
          if (!/script-src-attr 'none'/i.test(html)) fail('script-src-attr must be none');
          if (!/font-src 'self'/i.test(html)) fail('font-src must be self-only');
          if (!/style-src-elem 'self'/i.test(html)) fail('style-src-elem must be self-only');
          if (!/style-src-attr 'unsafe-inline'/i.test(html)) fail('style-src-attr compatibility policy missing');
          if (!/<meta\b[^>]*name=["']mobile-web-app-capable["'][^>]*content=["']yes["']/i.test(html)) fail('mobile-web-app-capable missing');

          for (const file of [manifest.assets.vendor, manifest.assets.js, manifest.assets.css, ...manifest.assets.fonts]) {
            if (!fs.existsSync('dist/' + file)) fail('missing production asset: ' + file);
          }
          if (!fs.existsSync('dist/THIRD_PARTY_NOTICES.txt')) fail('third-party notices missing');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
