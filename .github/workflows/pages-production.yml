name: Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Audit browser source for secrets
        run: npm run audit

      - name: Build hardened production site
        run: npm run build

      - name: Verify source maps are absent
        shell: bash
        run: |
          if find dist -type f \( -name '*.map' -o -name '*.ts' -o -name '*.scss' \) | grep -q .; then
            echo 'Forbidden development artifacts found in dist/' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
