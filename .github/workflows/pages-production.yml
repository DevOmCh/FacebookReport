# Phase 8.3.2 — single hardened production deployment pipeline
name: Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Audit browser source for secrets
        run: npm run audit

      - name: Build hardened production site
        run: npm run build

      - name: Verify Phase 8.3.2 production artifact
        shell: bash
        run: |
          set -euo pipefail

          if find dist -type f \( -name '*.map' -o -name '*.ts' -o -name '*.scss' \) | grep -q .; then
            echo 'Forbidden development artifacts found in dist/' >&2
            exit 1
          fi

          if grep -Rqi 'sourceMappingURL' dist; then
            echo 'sourceMappingURL found in production artifact' >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('dist/build-manifest.json', 'utf8'));

          const fail = msg => { console.error(msg); process.exit(1); };
          if (!manifest.vendorSelfHosted) fail('vendorSelfHosted must be true');
          if (!Array.isArray(manifest.externalScriptHosts) || manifest.externalScriptHosts.length !== 0) fail('externalScriptHosts must be empty');
          if (!manifest.assets?.vendor || !/^assets\/vendor\.[a-f0-9]+\.min\.js$/.test(manifest.assets.vendor)) fail('hashed vendor asset missing');
          if (/cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com/i.test(html)) fail('CDN vendor host remains in HTML/CSP');
          if (/<script\b[^>]*\bsrc=["']https?:\/\//i.test(html)) fail('external script tag remains');
          if (/<style\b/i.test(html)) fail('inline style block remains');
          if (!/<meta\b[^>]*name=["']mobile-web-app-capable["'][^>]*content=["']yes["']/i.test(html)) fail('mobile-web-app-capable missing');
          if (!fs.existsSync('dist/' + manifest.assets.vendor)) fail('vendor bundle not found');
          if (!fs.existsSync('dist/THIRD_PARTY_NOTICES.txt')) fail('third-party notices missing');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
