# Phase 8.3 — single hardened production deployment pipeline
name: Production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Audit browser source for secrets
        run: npm run audit

      - name: Build hardened production site
        run: npm run build

      - name: Verify hardened production artifact
        shell: bash
        run: |
          set -euo pipefail

          if find dist -type f \( -name '*.map' -o -name '*.ts' -o -name '*.scss' \) | grep -q .; then
            echo 'Forbidden development artifacts found in dist/' >&2
            exit 1
          fi

          if grep -Eqi '<style\b' dist/index.html; then
            echo 'Inline style block remains in dist/index.html' >&2
            exit 1
          fi

          if grep -Eqi 'phase7\.(css|js)|pwa-register\.js' dist/index.html; then
            echo 'Legacy source asset reference remains in dist/index.html' >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/build-manifest.json', 'utf8'));
          const failures = [];
          if (manifest.version !== '8.3') failures.push('manifest version is not 8.3');
          if (manifest.sourceMaps !== false) failures.push('source maps are not disabled');
          if (manifest.fullSourceExtraction !== true) failures.push('full extraction is not enabled');
          if (manifest.inlineStyleBlocks !== 0) failures.push('inline style blocks remain');
          if (manifest.executableInlineScripts !== 0) failures.push('inline executable scripts remain');
          if (manifest.obfuscated !== true) failures.push('obfuscation is not enabled');
          if (!/^assets\/app\.[a-f0-9]{12}\.min\.css$/.test(manifest.assets.css)) failures.push('CSS asset is not fingerprinted');
          if (!/^assets\/app\.[a-f0-9]{12}\.min\.js$/.test(manifest.assets.js)) failures.push('JS asset is not fingerprinted');
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Phase 8.3 production verification passed.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
