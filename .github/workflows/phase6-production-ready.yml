name: Phase 6 Production Ready Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase6-production-ready.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Direct Secure Build metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if "worker-src 'none'" in html:
              html = html.replace("worker-src 'none'", "worker-src 'self'", 1)

          marker = '<meta name="theme-color" content="#08111f">'
          block = '''<meta name="description" content="แดชบอร์ดกิจกรรมโรงเรียนวัดร้องอ้อ สำหรับติดตาม ค้นหา สรุป และจัดทำรายงานกิจกรรมของโรงเรียน">
          <meta name="robots" content="index,follow,max-image-preview:large">
          <meta name="application-name" content="FacebookReport">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="กิจกรรม ร้องอ้อ">
          <link rel="canonical" href="https://devomch.github.io/FacebookReport/">
          <link rel="manifest" href="./manifest.webmanifest">
          <link rel="icon" href="./favicon.svg" type="image/svg+xml">
          <link rel="apple-touch-icon" href="./favicon.svg">
          <link rel="preconnect" href="https://docs.google.com" crossorigin>
          <link rel="dns-prefetch" href="//images.unsplash.com">
          <meta property="og:locale" content="th_TH">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="โรงเรียนวัดร้องอ้อ">
          <meta property="og:title" content="แดชบอร์ดกิจกรรม | โรงเรียนวัดร้องอ้อ">
          <meta property="og:description" content="ติดตาม ค้นหา สรุป และจัดทำรายงานกิจกรรมของโรงเรียนวัดร้องอ้อ">
          <meta property="og:url" content="https://devomch.github.io/FacebookReport/">
          <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=82">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="แดชบอร์ดกิจกรรมโรงเรียนวัดร้องอ้อ">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="แดชบอร์ดกิจกรรม | โรงเรียนวัดร้องอ้อ">
          <meta name="twitter:description" content="ติดตาม ค้นหา สรุป และจัดทำรายงานกิจกรรมของโรงเรียนวัดร้องอ้อ">
          <meta name="twitter:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=82">'''

          if 'name="description"' not in html:
              if marker not in html:
                  raise SystemExit('theme-color marker not found')
              html = html.replace(marker, marker + '\n' + block, 1)

          register_tag = '<script src="./pwa-register.js" defer></script>'
          if register_tag not in html:
              anchor = '<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>'
              if anchor not in html:
                  raise SystemExit('PapaParse SRI anchor not found')
              html = html.replace(anchor, anchor + '\n' + register_tag, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Create PWA and production files
        shell: bash
        run: |
          set -euo pipefail

          cat > manifest.webmanifest <<'EOF'
          {
            "name": "แดชบอร์ดกิจกรรม โรงเรียนวัดร้องอ้อ",
            "short_name": "กิจกรรม ร้องอ้อ",
            "description": "แดชบอร์ดสำหรับติดตาม ค้นหา สรุป และจัดทำรายงานกิจกรรมของโรงเรียนวัดร้องอ้อ",
            "lang": "th",
            "dir": "ltr",
            "id": "./",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#08111f",
            "theme_color": "#08111f",
            "categories": ["education", "productivity"],
            "icons": [
              {
                "src": "./favicon.svg",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

          cat > favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
            <title id="title">โรงเรียนวัดร้องอ้อ</title>
            <desc id="desc">ไอคอนแดชบอร์ดกิจกรรม</desc>
            <rect width="512" height="512" rx="120" fill="#08111f"/>
            <rect x="54" y="54" width="404" height="404" rx="100" fill="#f59e0b"/>
            <rect x="82" y="82" width="348" height="348" rx="78" fill="#0b1728"/>
            <path d="M133 171h55l36 159 39-119h46l39 119 36-159h55l-61 208h-51l-41-119-41 119h-51z" fill="#f8fafc"/>
          </svg>
          EOF

          cat > pwa-register.js <<'EOF'
          (() => {
            'use strict';
            if (!('serviceWorker' in navigator)) return;

            window.addEventListener('load', async () => {
              try {
                const registration = await navigator.serviceWorker.register('./sw.js', {
                  scope: './',
                  updateViaCache: 'none'
                });

                registration.update().catch(() => {});
                if (registration.waiting) {
                  registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }

                registration.addEventListener('updatefound', () => {
                  const worker = registration.installing;
                  if (!worker) return;
                  worker.addEventListener('statechange', () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.info('FacebookReport: เวอร์ชันใหม่พร้อมใช้งานหลังรีเฟรชหน้า');
                    }
                  });
                });
              } catch (error) {
                console.warn('FacebookReport: ลงทะเบียน Service Worker ไม่สำเร็จ', error);
              }
            }, { once: true });
          })();
          EOF

          cat > sw.js <<'EOF'
          'use strict';

          const CACHE_VERSION = 'facebookreport-v6-20260914';
          const CORE_CACHE = `${CACHE_VERSION}-core`;
          const RUNTIME_CACHE = `${CACHE_VERSION}-runtime`;
          const SCOPE = self.registration.scope;
          const coreUrl = path => new URL(path, SCOPE).href;

          const CORE_ASSETS = [
            coreUrl('./'),
            coreUrl('./index.html'),
            coreUrl('./offline.html'),
            coreUrl('./manifest.webmanifest'),
            coreUrl('./favicon.svg'),
            coreUrl('./pwa-register.js')
          ];

          const STATIC_REMOTE_HOSTS = new Set([
            'cdn.jsdelivr.net',
            'cdnjs.cloudflare.com',
            'fonts.googleapis.com',
            'fonts.gstatic.com',
            'images.unsplash.com'
          ]);

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CORE_CACHE)
                .then(cache => cache.addAll(CORE_ASSETS))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(
                keys.filter(key => key.startsWith('facebookreport-') && ![CORE_CACHE, RUNTIME_CACHE].includes(key))
                  .map(key => caches.delete(key))
              );
              await self.clients.claim();
            })());
          });

          self.addEventListener('message', event => {
            if (event.data && event.data.type === 'SKIP_WAITING') self.skipWaiting();
          });

          async function staleWhileRevalidate(request) {
            const cache = await caches.open(RUNTIME_CACHE);
            const cached = await cache.match(request);
            const networkPromise = fetch(request).then(response => {
              if (response && (response.ok || response.type === 'opaque')) {
                cache.put(request, response.clone()).catch(() => {});
              }
              return response;
            }).catch(() => cached);
            return cached || networkPromise;
          }

          async function navigationResponse(request) {
            try {
              const response = await fetch(request);
              if (response && response.ok) {
                const cache = await caches.open(CORE_CACHE);
                cache.put(coreUrl('./index.html'), response.clone()).catch(() => {});
              }
              return response;
            } catch (_) {
              const cache = await caches.open(CORE_CACHE);
              return (await cache.match(coreUrl('./index.html'))) || (await cache.match(coreUrl('./offline.html')));
            }
          }

          self.addEventListener('fetch', event => {
            const request = event.request;
            if (request.method !== 'GET') return;

            const url = new URL(request.url);

            if (request.mode === 'navigate') {
              event.respondWith(navigationResponse(request));
              return;
            }

            if (url.origin === self.location.origin) {
              event.respondWith(staleWhileRevalidate(request));
              return;
            }

            // Keep Google Sheets data network-only so activity data is never silently stale.
            if (url.hostname === 'docs.google.com') return;

            if (STATIC_REMOTE_HOSTS.has(url.hostname)) {
              event.respondWith(staleWhileRevalidate(request));
            }
          });
          EOF

          cat > offline.html <<'EOF'
          <!doctype html>
          <html lang="th">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
            <meta name="theme-color" content="#08111f">
            <title>ออฟไลน์ | โรงเรียนวัดร้องอ้อ</title>
            <style>body{margin:0;background:#08111f;color:#f8fafc;font:16px/1.7 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:620px;background:#0b1728;border:1px solid #263244;border-radius:24px;padding:32px;box-shadow:0 20px 70px rgba(0,0,0,.35)}h1{margin:0 0 12px;font-size:clamp(28px,5vw,44px)}p{color:#cbd5e1}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f59e0b;color:#08111f;font-weight:800;margin-bottom:18px}a{color:#fbbf24;font-weight:700}</style>
          </head>
          <body><main class="card"><span class="badge">OFFLINE</span><h1>ยังเชื่อมต่ออินเทอร์เน็ตไม่ได้</h1><p>ตัวแอปถูกเก็บไว้สำหรับการเปิดแบบออฟไลน์ แต่ข้อมูลกิจกรรมจาก Google Sheets ต้องใช้อินเทอร์เน็ตเพื่อให้เป็นข้อมูลล่าสุด</p><p><a href="./">ลองเปิดแดชบอร์ดอีกครั้ง</a></p></main></body>
          </html>
          EOF

          cat > 404.html <<'EOF'
          <!doctype html>
          <html lang="th">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
            <meta name="robots" content="noindex">
            <meta name="theme-color" content="#08111f">
            <title>ไม่พบหน้า | โรงเรียนวัดร้องอ้อ</title>
            <style>body{margin:0;background:#08111f;color:#f8fafc;font:16px/1.7 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:620px;background:#0b1728;border:1px solid #263244;border-radius:24px;padding:32px}strong{font-size:64px;color:#f59e0b;display:block;line-height:1}a{display:inline-block;margin-top:12px;padding:11px 16px;background:#f59e0b;color:#08111f;text-decoration:none;border-radius:12px;font-weight:800}</style>
          </head>
          <body><main class="card"><strong>404</strong><h1>ไม่พบหน้าที่ต้องการ</h1><p>ลิงก์อาจถูกเปลี่ยนหรือไม่มีอยู่ในเว็บไซต์นี้</p><a href="./">กลับไปแดชบอร์ดกิจกรรม</a></main></body>
          </html>
          EOF

          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://devomch.github.io/FacebookReport/sitemap.xml
          EOF

          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://devomch.github.io/FacebookReport/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

          cat > README.md <<'EOF'
          # FacebookReport — โรงเรียนวัดร้องอ้อ

          Production dashboard สำหรับติดตาม ค้นหา สรุป และจัดทำรายงานกิจกรรมของโรงเรียนวัดร้องอ้อ

          ## Live site

          https://devomch.github.io/FacebookReport/

          ## Production architecture

          - Direct Secure Build: `index.html` เป็นตัวแอปโดยตรง ไม่มี runtime bootstrap/base64 payload
          - Content Security Policy (CSP) ในเอกสารหลัก
          - Subresource Integrity (SRI) สำหรับ `docx`, `FileSaver.js` และ `PapaParse`
          - Google Sheets ใช้ CSV `fetch()`; ไม่มี JSONP และไม่มี dynamic CDN fallback
          - PWA: manifest + service worker + offline fallback
          - SEO/Social: canonical, description, Open Graph, Twitter Card, robots.txt และ sitemap.xml
          - GitHub Pages: `.nojekyll` เพื่อเสิร์ฟ static files โดยตรง

          ## Data freshness

          Service Worker จะไม่ cache `docs.google.com` เพื่อป้องกันข้อมูลกิจกรรมเก่าถูกแสดงแบบเงียบ ๆ ข้อมูล Google Sheets จึงยังเป็น network-first ตามระบบหลัก

          ## Security note

          GitHub Pages ไม่เปิดให้กำหนด HTTP security headers ของ origin ได้ทั้งหมด ดังนั้น CSP ปัจจุบันใช้ `<meta http-equiv="Content-Security-Policy">`. หากย้ายไป hosting ที่กำหนด response headers ได้ ควรเพิ่ม CSP response header (รวม `frame-ancestors`), HSTS, `X-Content-Type-Options` และ `Permissions-Policy`.
          EOF

          : > .nojekyll

      - name: Validate Phase 6 build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check pwa-register.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'name="description"',
              'rel="canonical"',
              'rel="manifest"',
              'property="og:title"',
              'name="twitter:card"',
              '<script src="./pwa-register.js" defer></script>',
              "worker-src 'self'",
              'integrity="sha384-4xaIisuLEy2lo2HkB2C4rEf7v8jbTb2kuogX6TkuEt9feTWKBSFSOzsqNNbV+sKh"',
              'integrity="sha384-PlRSzpewlarQuj5alIadXwjNUX+2eNMKwr0f07ShWYLy8B6TjEbm7ZlcN/ScSbwy"',
              'integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ=="'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing required production markers: ' + ', '.join(missing))
          if 'worker-src \'none\'' in html:
              raise SystemExit('worker-src still blocks the PWA service worker')
          if 'createElement(\'script\')' in html or 'createElement("script")' in html:
              raise SystemExit('dynamic script injection detected')
          print('Phase 6 static validation passed')
          PY
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s offline.html
          test -s 404.html
          test -s favicon.svg

      - name: Commit Phase 6 Production Ready
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest favicon.svg pwa-register.js sw.js offline.html 404.html robots.txt sitemap.xml README.md .nojekyll
          if git diff --cached --quiet; then
            echo 'No Phase 6 changes to commit.'
            exit 0
          fi
          git commit -m 'feat: Phase 6 production ready PWA SEO and offline support'
          git push origin HEAD:main
